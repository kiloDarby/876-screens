<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>876 Screens Hero Carousel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --bg-soft: #0d0d0d;
      --text: #f9f5ea;
      --muted: #d8d2c2;
      --gold: #f1c627;
      --gold-dark: #c89f12;
      --border: rgba(241, 198, 39, 0.28);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(241, 198, 39, 0.06), transparent 20%),
        linear-gradient(to bottom, #0a0a0a, #000);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .page {
      width: min(100%, 480px);
      margin-inline: auto;
      min-height: 100vh;
      background: linear-gradient(to bottom, #0a0a0a, #000);
      padding-bottom: 2rem;
    }

    /* simple test nav */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1rem 0.75rem;
    }

    .nav__logo {
      font-weight: 900;
      font-size: 1.5rem;
      color: var(--gold);
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .nav__menu {
      font-size: 1.75rem;
      color: var(--text);
    }

    .hero {
      padding: 1rem;
    }

    .hero-carousel {
      position: relative;
      width: 100%;
      height: 26rem;
      overflow: hidden;
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      background:
        linear-gradient(180deg, rgba(20, 14, 4, 0.18), rgba(0, 0, 0, 0.85)),
        #000;
      box-shadow:
        inset 0 0 25px rgba(241, 198, 39, 0.05),
        0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.55s ease;
      will-change: transform;
    }

    .movie-slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }

    .movie-slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: brightness(0.52);
      transform: scale(1.02);
      user-select: none;
      pointer-events: none;
    }

    .movie-slide::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.08) 0%,
          rgba(0, 0, 0, 0.2) 30%,
          rgba(0, 0, 0, 0.68) 75%,
          rgba(0, 0, 0, 0.94) 100%
        );
      z-index: 1;
    }

    .movie-overlay {
      position: absolute;
      inset: auto 0 0 0;
      z-index: 2;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .movie-tag {
      align-self: flex-start;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold), #f7de73);
      color: #111;
      font-weight: 800;
      font-size: 0.85rem;
    }

    .movie-title {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
    }

    .movie-meta {
      color: #f0ede5;
      font-size: 1rem;
      line-height: 1.4;
    }

    .movie-btn {
      margin-top: 0.3rem;
      align-self: flex-start;
      text-decoration: none;
      padding: 0.95rem 1.35rem;
      border-radius: 0.85rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #111;
      font-weight: 900;
      font-size: 1.05rem;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease;
    }

    .movie-btn:hover {
      transform: translateY(-2px);
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      z-index: 3;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      border: 1px solid rgba(241, 198, 39, 0.55);
      background: rgba(7, 7, 7, 0.72);
      color: var(--gold);
      font-size: 1.75rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .carousel-btn:hover {
      background: rgba(20, 20, 20, 0.95);
      transform: scale(1.04);
    }

    .carousel-btn--left {
      left: 0.75rem;
    }

    .carousel-btn--right {
      right: 0.75rem;
    }

    @media (min-width: 48rem) {
      .page {
        width: min(100%, 900px);
      }

      .hero-carousel {
        height: 34rem;
      }

      .movie-overlay {
        padding: 2rem;
      }

      .movie-title {
        font-size: clamp(2.25rem, 5vw, 3.5rem);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="nav__logo">876 Screens</div>
      <div class="nav__links">
        <span>Home</span>
        <span>Schedule</span>
        <span>Login</span>
        <span class="nav__menu">☰</span>
      </div>
    </header>

    <section class="hero">
      <div class="hero-carousel">
        <button class="carousel-btn carousel-btn--left" aria-label="Previous slide">‹</button>

        <div class="carousel-track">
          <article class="movie-slide">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1400&auto=format&fit=crop" alt="Movie poster 1">
            <div class="movie-overlay">
              <p class="movie-tag">Now Showing</p>
              <h1 class="movie-title">The Dark Reign</h1>
              <p class="movie-meta">Action • 2h 08m • PG-13</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </article>

          <article class="movie-slide">
            <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1400&auto=format&fit=crop" alt="Movie poster 2">
            <div class="movie-overlay">
              <p class="movie-tag">This Week</p>
              <h1 class="movie-title">Crimson Night</h1>
              <p class="movie-meta">Thriller • 1h 54m • 16+</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </article>

          <article class="movie-slide">
            <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=1400&auto=format&fit=crop" alt="Movie poster 3">
            <div class="movie-overlay">
              <p class="movie-tag">Coming Soon</p>
              <h1 class="movie-title">Echoes of Fire</h1>
              <p class="movie-meta">Drama • 2h 12m • PG</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </article>
        </div>

        <button class="carousel-btn carousel-btn--right" aria-label="Next slide">›</button>
      </div>
    </section>
  </div>

  <script>
    const track = document.querySelector(".carousel-track");
    const slides = [...document.querySelectorAll(".movie-slide")];
    const prevBtn = document.querySelector(".carousel-btn--left");
    const nextBtn = document.querySelector(".carousel-btn--right");

    let currentIndex = 0;
    let autoPlay;

    function goToSlide(index) {
      currentIndex = index;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      goToSlide(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      goToSlide(currentIndex);
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlay = setInterval(nextSlide, 4000);
    }

    function stopAutoPlay() {
      clearInterval(autoPlay);
    }

    nextBtn.addEventListener("click", () => {
      nextSlide();
      startAutoPlay();
    });

    prevBtn.addEventListener("click", () => {
      prevSlide();
      startAutoPlay();
    });

    const carousel = document.querySelector(".hero-carousel");
    carousel.addEventListener("mouseenter", stopAutoPlay);
    carousel.addEventListener("mouseleave", startAutoPlay);

    goToSlide(0);
    startAutoPlay();
  </script>
</body>
</html>
