<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>876 Screens - Hero Carousel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    /* NAV (simple for testing) */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      color: #f1c627;
    }

    /* HERO */
    .hero {
      padding: 1rem;
    }

    .hero-carousel {
      position: relative;
      width: 100%;
      min-height: 26rem;
      border-radius: 1rem;
      overflow: hidden;

      background:
        linear-gradient(180deg, rgba(20, 14, 4, 0.55), rgba(0, 0, 0, 0.9)),
        radial-gradient(circle at top, rgba(241, 198, 39, 0.08), transparent 40%),
        #050505;

      border: 1px solid rgba(241, 198, 39, 0.22);
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(241, 198, 39, 0.05);
    }

    .carousel-track-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s ease;
    }

    .movie-slide {
      position: relative;
      min-width: 100%;
      height: 26rem;
      flex-shrink: 0;
    }

    .movie-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .movie-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 0.5rem;
      padding: 1.25rem;

      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.1),
        rgba(0, 0, 0, 0.9)
      );
    }

    .movie-tag {
      background: linear-gradient(135deg, #f1c627, #f7dd72);
      color: #111;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      width: fit-content;
      font-weight: bold;
    }

    .movie-title {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      color: #f9f5ea;
    }

    .movie-meta {
      font-size: 0.9rem;
      color: #ccc;
    }

    .movie-btn {
      margin-top: 0.5rem;
      padding: 0.7rem 1.2rem;
      border-radius: 0.6rem;
      background: linear-gradient(135deg, #f1c627, #d7a514);
      color: #111;
      font-weight: bold;
      text-decoration: none;
      width: fit-content;
      transition: 0.2s;
    }

    .movie-btn:hover {
      transform: translateY(-2px);
    }

    /* BUTTONS */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;

      width: 2.8rem;
      height: 2.8rem;
      border-radius: 50%;
      border: 1px solid rgba(241, 198, 39, 0.5);

      background: rgba(0, 0, 0, 0.6);
      color: #f1c627;
      font-size: 1.4rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .carousel-btn--left { left: 10px; }
    .carousel-btn--right { right: 10px; }

    .carousel-btn:hover {
      background: rgba(30, 30, 30, 0.9);
    }

    @media (min-width: 48rem) {
      .movie-slide {
        height: 32rem;
      }
    }
  </style>
</head>

<body>

  <div class="nav">
    <div>🎬 876 Screens</div>
    <div>Home | Schedule | Login</div>
  </div>

  <section class="hero">
    <div class="hero-carousel">

      <button class="carousel-btn carousel-btn--left">&#10094;</button>

      <div class="carousel-track-container">
        <div class="carousel-track">

          <!-- Slide 1 -->
          <div class="movie-slide">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200" />
            <div class="movie-overlay">
              <p class="movie-tag">Now Showing</p>
              <h1 class="movie-title">The Dark Reign</h1>
              <p class="movie-meta">Action • 2h 08m • PG-13</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="movie-slide">
            <img src="https://images.unsplash.com/photo-1505685296765-3a2736de412f?q=80&w=1200" />
            <div class="movie-overlay">
              <p class="movie-tag">This Week</p>
              <h1 class="movie-title">Crimson Night</h1>
              <p class="movie-meta">Thriller • 1h 54m • 16+</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="movie-slide">
            <img src="https://images.unsplash.com/photo-1517602302552-471fe67acf66?q=80&w=1200" />
            <div class="movie-overlay">
              <p class="movie-tag">Coming Soon</p>
              <h1 class="movie-title">Echoes of Fire</h1>
              <p class="movie-meta">Drama • 2h 12m • PG</p>
              <a href="#" class="movie-btn">Buy Ticket</a>
            </div>
          </div>

        </div>
      </div>

      <button class="carousel-btn carousel-btn--right">&#10095;</button>

    </div>
  </section>

  <script>
    const track = document.querySelector(".carousel-track");
    const slides = document.querySelectorAll(".movie-slide");
    const nextBtn = document.querySelector(".carousel-btn--right");
    const prevBtn = document.querySelector(".carousel-btn--left");

    let index = 0;
    let autoSlide;

    function update() {
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    function next() {
      index = (index + 1) % slides.length;
      update();
    }

    function prev() {
      index = (index - 1 + slides.length) % slides.length;
      update();
    }

    function startAuto() {
      autoSlide = setInterval(next, 4000);
    }

    function stopAuto() {
      clearInterval(autoSlide);
    }

    nextBtn.onclick = () => {
      stopAuto();
      next();
      startAuto();
    };

    prevBtn.onclick = () => {
      stopAuto();
      prev();
      startAuto();
    };

    track.addEventListener("mouseenter", stopAuto);
    track.addEventListener("mouseleave", startAuto);

    update();
    startAuto();
  </script>

</body>
</html>
