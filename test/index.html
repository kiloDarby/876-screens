<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Reusable Navigation Component</title>  <!--    REUSING THIS NAV IN FUTURE PROJECTS    ==================================    1. Copy this nav block into your new project    2. Link nav.css in the <head>    3. Link nav.js with the defer attribute    4. Change the brand text    5. Change the link text and href values    6. Update theme variables in nav.css    IMPORTANT:    Keep the required data-* attributes and core class names unless    you also update nav.js and nav.css to match.  -->  <link rel="stylesheet" href="nav.css" />  <script src="nav.js" defer></script></head><body>  <!--    SAFE AREA: OUTER WRAPPERS    =========================    You may wrap this nav in another header/container if your project needs it.    SAFE TO CHANGE:    - surrounding page structure    - outer wrappers around this component    DO NOT REMOVE:    - class="nav"    - data-nav  -->  <header class="nav" data-nav>    <div class="nav__container">      <!--        SAFE AREA: BRAND        =================        You may replace this with:        - plain text        - logo image        - logo + text        - homepage link        SAFE TO CHANGE:        - href        - visible text        - inner HTML        KEEP:        - class="nav__brand"      -->      <a href="/" class="nav__brand">Brand Name</a>      <!--        REQUIRED TOGGLE BUTTON        ======================        This is the button that opens/closes the mobile menu.        SAFE TO CHANGE:        - aria-label text        - internal icon structure (if you also update CSS)        DO NOT REMOVE:        - class="nav__toggle"        - data-nav-toggle      -->      <button        class="nav__toggle"        type="button"        aria-label="Open menu"        aria-expanded="false"        aria-controls="nav-panel"        data-nav-toggle      >        <span class="nav__toggle-line"></span>        <span class="nav__toggle-line"></span>        <span class="nav__toggle-line"></span>      </button>      <!--        REQUIRED OVERLAY        ================        Needed for:        - dim background        - click outside to close        DO NOT REMOVE:        - class="nav__overlay"        - data-nav-overlay      -->      <div class="nav__overlay" data-nav-overlay></div>      <!--        SAFE AREA: MOBILE PANEL / DESKTOP CONTAINER        ===========================================        This holds the mobile slide-out panel and also becomes the desktop nav area.        SAFE TO CHANGE:        - add extra wrappers inside        - add CTA buttons        - add user/account area        - add icons        - add a search box        DO NOT REMOVE:        - class="nav__panel"        - id="nav-panel" (or update aria-controls to match)        - data-nav-panel      -->      <div class="nav__panel" id="nav-panel" data-nav-panel>        <!--          SAFE AREA: PANEL HEADER          =======================          This area only shows in the mobile panel.          SAFE TO CHANGE:          - panel brand text          - add logo          - change close icon          DO NOT REMOVE:          - class="nav__panel-header"          - class="nav__close"          - data-nav-close        -->        <div class="nav__panel-header">          <span class="nav__panel-brand">Brand Name</span>          <button            class="nav__close"            type="button"            aria-label="Close menu"            data-nav-close          >            &times;          </button>        </div>        <!--          SAFE AREA: NAV LINKS          ====================          This is the main place you will customize per project.          SAFE TO CHANGE:          - href values          - link text          - number of links          - which link is active          - add grouped nav sections          RECOMMENDED:          Keep class="nav__link" on clickable menu links so the JS          can auto-close the menu on mobile after a link is clicked.        -->        <nav class="nav__menu" aria-label="Primary navigation">          <a href="/" class="nav__link nav__link--active">Home</a>          <a href="/about.html" class="nav__link">About</a>          <a href="/services.html" class="nav__link">Services</a>          <a href="/projects.html" class="nav__link">Projects</a>          <a href="/contact.html" class="nav__link">Contact</a>        </nav>        <!--          OPTIONAL SAFE AREA: EXTRA CONTENT          =================================          Add things like:          - login button          - CTA button          - social links          - support links          Example:          <div class="nav__extras">            <a href="/login.html" class="nav__cta">Login</a>          </div>        -->      </div>    </div>  </header>  <!-- Demo content only -->  <main class="demo-content">    <section class="demo-hero">      <h1>Reusable Navigation Component</h1>      <p>        This page is just for testing the navigation component locally.      </p>    </section>  </main></body></html>
