<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>876 Screens Nav (FINAL)</title>  <style>    :root {      --bg-primary: #000001;      --bg-card: #262109;      --text-primary: #F7F2D0;      --primary: #FFEB27;    }    * {      margin: 0;      padding: 0;      box-sizing: border-box;    }    body {      background: var(--bg-primary);      color: var(--text-primary);      font-family: Arial, sans-serif;    }    a {      text-decoration: none;      color: inherit;    }    /* =========================        MOBILE NAV    ========================= */    .site-nav {      display: flex;      align-items: center;      gap: 0.75rem;      padding: 1rem;      background: rgba(38, 33, 9, 0.9);      backdrop-filter: blur(10px);      position: sticky;      top: 0;      z-index: 1000;    }    .logo {      color: var(--primary);      font-weight: bold;    }    .nav-left {      display: flex;      gap: 0.75rem;    }    .nav-right {      margin-left: auto;      display: flex;      align-items: center;      gap: 0.75rem;    }    .nav-right a {      display: none;    }    .nav-toggle {      background: none;      border: none;      font-size: 1.5rem;      color: var(--text-primary);      cursor: pointer;    }    /* =========================        MOBILE MENU    ========================= */    .mobile-menu {      position: fixed;      top: 0;      right: -100%;      width: min(90vw, 300px);      height: 100vh;      background: var(--bg-card);      display: flex;      flex-direction: column;      gap: 1.5rem;      padding: 2rem;      transition: right 0.3s ease;      z-index: 999;    }    .mobile-menu.show {      right: 0;    }    .overlay {      position: fixed;      inset: 0;      background: rgba(0,0,0,0.5);      opacity: 0;      pointer-events: none;      transition: 0.3s;      z-index: 998;    }    .overlay.show {      opacity: 1;      pointer-events: all;    }    /* =========================        DESKTOP GRID (2 ROWS)    ========================= */    @media (min-width: 48rem) {      .site-nav {        display: grid;        grid-template-columns: 1fr auto 1fr;        grid-template-rows: auto auto;        padding: 1rem 2rem;        align-items: center;      }      /* LEFT SIDE */      .nav-left {        grid-column: 1;        grid-row: 1 / 3;        justify-self: end;        display: flex;        gap: 2rem;      }      /* LOGO CENTER (SPAN 2 ROWS) */      .logo {        grid-column: 2;        grid-row: 1 / 3;        justify-self: center;        align-self: center;        font-size: 1.2rem;      }      /* RIGHT SIDE */      .nav-right {        grid-column: 3;        grid-row: 1 / 3;        justify-self: start;        margin-left: 0;        display: flex;        gap: 2rem;      }      .nav-right a {        display: inline;      }      .nav-toggle {        display: none;      }      .mobile-menu,      .overlay {        display: none;      }    }    .content {      padding: 2rem;    }  </style></head><body>  <!-- NAV -->  <nav class="site-nav" aria-label="Main navigation">    <!-- LOGO -->    <a href="#" class="logo">876 Screens</a>    <!-- LEFT -->    <div class="nav-left">      <a href="#">Home</a>      <a href="#">Schedule</a>    </div>    <!-- RIGHT -->    <div class="nav-right">      <a href="#">Login</a>      <a href="#">Register</a>      <button class="nav-toggle" aria-label="Open menu">☰</button>    </div>  </nav>  <!-- MOBILE MENU -->  <div class="mobile-menu" id="mobileMenu">    <a href="#">Home</a>    <a href="#">Schedule</a>    <a href="#">Login</a>    <a href="#">Register</a>    <a href="#">About</a>    <a href="#">Contact</a>  </div>  <!-- OVERLAY -->  <div class="overlay" id="overlay"></div>  <!-- DEMO -->  <div class="content">    <h1>876 Screens</h1>    <p>Resize screen to test.</p>  </div>  <script>    const toggleBtn = document.querySelector(".nav-toggle");    const mobileMenu = document.getElementById("mobileMenu");    const overlay = document.getElementById("overlay");    function toggleMenu() {      mobileMenu.classList.toggle("show");      overlay.classList.toggle("show");    }    toggleBtn.addEventListener("click", toggleMenu);    overlay.addEventListener("click", toggleMenu);  </script></body></html>
