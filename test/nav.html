<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Responsive Navigation</title>  <style>    *,    *::before,    *::after {      box-sizing: border-box;    }    body {      margin: 0;      font-family: Arial, sans-serif;    }    .site-header {      padding: 1rem;      border-bottom: 1px solid #ddd;    }    .site-nav {      display: flex;      align-items: center;      justify-content: space-between;      gap: 1rem;    }    .nav-logo,    .nav-link {      text-decoration: none;      color: #111;      font-weight: 600;      white-space: nowrap;    }    .nav-links-mobile,    .nav-links-desktop {      display: flex;      align-items: center;      gap: 1rem;    }    .nav-toggle {      border: none;      background: none;      font-size: 1.5rem;      cursor: pointer;      padding: 0;    }    /* MOBILE FIRST */    .nav-links-mobile {      display: flex;    }    .nav-links-desktop {      display: none;    }    /* TABLET / DESKTOP */    @media (min-width: 48rem) {      .site-nav {        display: grid;        grid-template-columns: 1fr auto 1fr;        align-items: center;      }      .nav-logo {        grid-column: 2;        justify-self: center;      }      .nav-left {        grid-column: 1;        justify-self: end;      }      .nav-right {        grid-column: 3;        justify-self: start;      }      .nav-links-mobile {        display: none;      }      .nav-links-desktop {        display: flex;      }    }  </style></head><body>  <header class="site-header">    <nav class="site-nav">      <a href="#" class="nav-logo">876 Screens</a>      <!-- Mobile nav -->      <div class="nav-links-mobile">        <a href="#" class="nav-link">Home</a>        <a href="#" class="nav-link">Schedule</a>        <a href="#" class="nav-link">Login</a>        <button class="nav-toggle" aria-label="Open menu">☰</button>      </div>      <!-- Desktop left -->      <div class="nav-links-desktop nav-left">        <a href="#" class="nav-link">Home</a>        <a href="#" class="nav-link">Schedule</a>      </div>      <!-- Desktop right -->      <div class="nav-links-desktop nav-right">        <a href="#" class="nav-link">Login</a>        <a href="#" class="nav-link">Register</a>      </div>    </nav>  </header></body></html>
